name: container-build

# Build a container image for linux/amd64 and linux/arm64 on native runners,
# push each architecture by digest, create one multi-arch index, attest build
# provenance for the index digest, verify the attestation, and output the
# digest. Tags are for humans; deploy by digest.
# For pull requests, use container-check, which builds without pushing.
#
# Caller permissions required: contents: read, packages: write,
# id-token: write, attestations: write.

on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag, for example ghcr.io/leat-consulting/demo-app. Must be lower case.
        type: string
        required: true
      context:
        description: Build context directory.
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile. Defaults to Dockerfile in the context.
        type: string
        default: ""
    outputs:
      image:
        description: Image name, without tag or digest.
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: The sha256 digest of the multi-arch index.
        value: ${{ jobs.publish.outputs.digest }}

permissions: {}

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push images to GHCR
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Validate image name
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          if [ "$IMAGE" != "${IMAGE,,}" ] || [[ "$IMAGE" == *:* ]] || [[ "$IMAGE" == *@* ]]; then
            echo "::error::image must be lower case with no tag or digest"; exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push images to GHCR
      id-token: write # OIDC token for Sigstore signing
      attestations: write # store the provenance attestation
    outputs:
      image: ${{ inputs.image }}
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Create multi-arch index
        id: index
        env:
          IMAGE: ${{ inputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done <<< "$TAGS"
          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$digest")")
          done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::expected 2 architecture digests, found ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          first_tag="$(head -n 1 <<< "$TAGS")"
          digest="$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### Published \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow leat-consulting/platform-workflows/.github/workflows/container-build.yml \
            --deny-self-hosted-runners
          echo "Provenance verified for \`$IMAGE@$DIGEST\`." >> "$GITHUB_STEP_SUMMARY"
