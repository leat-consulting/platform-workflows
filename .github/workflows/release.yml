name: release

# Prepare a draft release with generated notes. Drafts do not create tags:
# the owner publishes the draft, which creates the immutable vX.Y.Z tag.
# Tag creation is restricted to the owner by the release-tags ruleset.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to propose, for example v1.0.0.
        required: true
        type: string

permissions: {}

# One release draft at a time; never cancel one that is in progress.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    name: draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create a draft release; drafts do not create tags
    steps:
      - name: Validate version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::releases are drafted from $DEFAULT_BRANCH only"; exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v1.2.3"; exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::a release named $VERSION already exists"; exit 1
          fi
          latest="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' | sort -V | tail -n 1)"
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::$VERSION is not newer than $latest"; exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          {
            echo "Draft release $VERSION created for commit \`$GITHUB_SHA\`."
            echo "The owner publishes it, which creates the tag."
          } >> "$GITHUB_STEP_SUMMARY"
